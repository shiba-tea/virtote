<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <link href="style.css" rel="stylesheet">
    <title>買い物メモ</title>
  </head>
  <body>
    <h1>買い物メモ</h1>

    <div id="wrapper">
      <div id="input-area">
        <h2>買うもの</h2>
        <form>
          品目：<input type="text" class="text-input" id="input-item" placeholder="林檎"><br>
          数量：<input type="text" class="text-input" id="input-quantity" placeholder="１個"><br>
          メモ：<textarea class="text-input" id="input-memo" placeholder="アップルパイの材料"></textarea><br>
          <input type="button" value="追加" id="input-button">
        </form>
      </div>

      <div id="data-area">
        <h2>リスト</h2>
        <input type="button" value="編集" id="edit-button"><br>
        <p>
          購入済みの品物を削除する
          <input type="button" value="実行" id="delete-button">
        </p>

        <table>
          <thead>
            <tr>
              <th>購入済</th><th>品目</th><th>数量</th><th>備考</th>
            </tr>
          </thead>
          <tbody>
          </tbody>
        </table>

      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
